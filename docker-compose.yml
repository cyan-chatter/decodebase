services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cfl
      POSTGRES_PASSWORD: cfl
      POSTGRES_DB: cfl
    ports:
      - "5432:5432"
    volumes:
      - cfl_pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfl"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
        -c shared_buffers=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c effective_cache_size=1GB
        -c max_connections=20

volumes:
  cfl_pgdata:
