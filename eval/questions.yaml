- id: symbol-01
  type: symbol
  question: What does validate_token do?
  verified: true
  expected:
    symbols:
    - auth/tokens.py::validate_token
  review:
    kind: agent
    reviewer: Codex
    method: independent fixture source review
    reviewed_at: '2026-10-03T19:55:00.698167+00:00'
    fixture_sha256: c95bc9af94eb44bceca348218d863beb2d0d10d3a8056e704404d54c3521bf10
    notes: validate_token partitions the token, compares it to a newly issued HMAC
      token, raises TokenError on mismatch, and returns user_id.
