[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeflowlens"
version = "0.1.0"
description = "Local code intelligence powered by local LLMs"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pathspec>=0.12",
    "tokenizers>=0.19",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.12", "ruff"]
sys = ["psutil"]
scip = ["protobuf>=4"]

[project.scripts]
cfl = "cfl.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
markers = ["db: needs Postgres"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
